{% macro boolean_toggle(name, label, checked=false, id=none, form=none, classes='') -%}
<label class="boolean-toggle{% if classes %} {{ classes }}{% endif %}" for="{{ id or name }}">
  <input id="{{ id or name }}" type="checkbox" role="switch" name="{{ name }}" value="on"
      {% if form %}form="{{ form }}"{% endif %} {% if checked %}checked{% endif %}>
  <span class="boolean-toggle-track" aria-hidden="true"></span>
  <span>{{ label }}</span>
</label>
{%- endmacro %}
