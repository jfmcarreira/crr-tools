[project]
name = "crr-shifts"
version = "0.1.0"
description = "Contínuos CRR shift rota application"
requires-python = ">=3.13,<3.14"
dependencies = [
  "crr-python",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "SQLAlchemy>=2.0,<3",
  "Jinja2>=3.1,<4",
  "python-multipart>=0.0.12,<1",
  "itsdangerous>=2.2,<3",
  "email-validator>=2.2,<3",
  "pydantic-settings>=2.5,<3",
  "alembic>=1.13,<2",
  "reportlab>=4.2,<5",
]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "pypdf>=5,<7"]

[tool.uv.sources]
crr-python = {workspace = true}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
