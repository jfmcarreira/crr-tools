[project]
name = "ttlock"
version = "0.1.0"
description = "Standalone TTLock API client and diagnostic CLI"
requires-python = ">=3.13,<3.14"
dependencies = ["httpx>=0.27,<1"]
readme = "README.md"

[project.scripts]
ttlock = "ttlock.cli:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ttlock"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
