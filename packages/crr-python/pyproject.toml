[project]
name = "crr-python"
version = "0.1.0"
description = "Shared CRR Python infrastructure"
requires-python = ">=3.13,<3.14"
dependencies = ["SQLAlchemy>=2.0,<3", "alembic>=1.13,<2"]
readme = "README.md"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crr_common"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
