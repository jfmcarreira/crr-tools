name: App checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.31'
      - run: make tooling-test
  tournament:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/tournament/frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.31'
          enable-cache: true
      - run: make tournament-install tournament-test tournament-build python-common-test
      - run: docker compose config --quiet
      - run: docker build -f apps/tournament/Dockerfile -t crr-tournament .
  shifts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.31'
          enable-cache: true
      - run: make shifts-test python-common-test ttlock-test
      - run: docker compose config --quiet
      - run: make shifts-build
