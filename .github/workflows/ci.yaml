name: App checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tournament: ${{ steps.filter.outputs.tournament }}
      shifts: ${{ steps.filter.outputs.shifts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.31'
      - run: make tooling-test
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: uv run --no-project --python 3.13 python tools/ci_changes.py --base "$BASE" --head "$HEAD" --output "$GITHUB_OUTPUT"
  tournament:
    needs: changes
    if: needs.changes.outputs.tournament == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/tournament/frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.31'
          enable-cache: true
      - run: make tournament-install tournament-test tournament-build python-common-test
      - run: docker compose config --quiet
      - run: docker build -f apps/tournament/Dockerfile -t crr-tournament .
  shifts:
    needs: changes
    if: needs.changes.outputs.shifts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.31'
          enable-cache: true
      - run: make shifts-test python-common-test
      - run: docker compose config --quiet
      - run: make shifts-build
